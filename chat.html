<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>FinAI — Chat</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body { overflow: hidden; }
    .chat-layout { display: flex; height: 100vh; padding-top: 64px; }
    .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); max-width: 900px; margin: 0 auto; width: 100%; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .msg-wrap { display: flex; gap: 12px; max-width: 80%; }
    .msg-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble { padding: 1rem; border-radius: 12px; font-size: 0.95rem; }
    .bubble-ai { background: var(--surface); border: 1px solid var(--border); }
    .bubble-user { background: var(--accent2); color: #fff; }
    .chat-input-area { padding: 1.5rem; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; }
    #chatInput { flex: 1; padding: 1rem; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--font); }
    #sendBtn { background: var(--accent); border: none; padding: 0 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo"><div class="logo-icon">₹</div>Fin<span>AI</span></a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/chat" class="active">Chat</a></li>
  </ul>
</nav>
<div class="chat-layout">
  <main class="chat-main">
    <div class="chat-messages" id="messages">
      <div class="msg-wrap"><div class="bubble bubble-ai">👋 Hi! I'm FinAI. Ask me about investing, budgeting, or taxes.</div></div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Ask about investing, budgeting..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </main>
</div>
<script>
  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;
    
    const messagesEl = document.getElementById('messages');
    messagesEl.innerHTML += `<div class="msg-wrap user"><div class="bubble bubble-user">${msg}</div></div>`;
    input.value = '';
    
    try {
      const res = await fetch('/api/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      messagesEl.innerHTML += `<div class="msg-wrap"><div class="bubble bubble-ai">${data.reply}</div></div>`;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } catch (e) { console.error(e); }
  }
</script>
</body>
</html>
